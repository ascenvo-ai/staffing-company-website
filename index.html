<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Staffing & Manpower Solutions</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      box-sizing: border-box;
    }

    .content {
      max-width: 750px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    h2 {
      font-size: 25px;
      font-weight: normal;
      margin-bottom: 25px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #111827;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 34px;
      }

      h2 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="content">

      <h1>Staffing & Manpower Solutions</h1>

      <h2>Your Trusted Recruitment Partner</h2>

      <p>
        Providing reliable manpower and staffing solutions across South India,
        with a vision to expand across Pan India.
      </p>

      <p>
        Currently specializing in the Automobile and Automotive industry.
      </p>

      <a href="#contact" class="button">
        Partner With Us
      </a>

    </div>
  </section>

</body>
</html>
